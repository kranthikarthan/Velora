version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: velora-postgres
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora
      POSTGRES_DB: velora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - velora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: velora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - velora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: velora-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - velora-network

  # MongoDB Document Store
  mongodb:
    image: mongo:6
    container_name: velora-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: velora
      MONGO_INITDB_ROOT_PASSWORD: velora
      MONGO_INITDB_DATABASE: velora
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - velora-network

  # Kafka Message Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: velora-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - velora-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: velora-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - velora-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: velora-prometheus
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - velora-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: velora-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - velora-network

  # Velora Core Application
  velora:
    build: .
    container_name: velora-core
    environment:
      DATABASE_URL: postgresql://velora:velora@postgres:5432/velora
      REDIS_URL: redis://redis:6379/0
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      MONGODB_URL: mongodb://velora:velora@mongodb:27017/velora
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"  # API
      - "9090:9090"  # Metrics
    volumes:
      - ./velora:/app/velora
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - postgres
      - redis
      - neo4j
      - mongodb
      - kafka
    networks:
      - velora-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: velora-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - velora
    networks:
      - velora-network

networks:
  velora-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  mongodb_data:
  prometheus_data:
  grafana_data: